name: chatmcp-e2e

services:
  bob:
    build:
      context: ../../..
      dockerfile: test/e2e/docker/Dockerfile
    image: chatmcp-e2e-agent:latest
    command: ["bob"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY required}
      CHATMCP_E2E_MODEL: ${CHATMCP_E2E_MODEL:-claude-haiku-4-5}
    volumes:
      - chat-data:/data

  alice:
    image: chatmcp-e2e-agent:latest
    command: ["alice"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY required}
      CHATMCP_E2E_MODEL: ${CHATMCP_E2E_MODEL:-claude-haiku-4-5}
    volumes:
      - chat-data:/data
    # bob must start first so the chat.db schema exists when alice opens it
    # AND so bob is polling chat_inbox by the time alice posts. depends_on
    # without health_check just guarantees process start, which is enough
    # since bob's poll loop tolerates an empty inbox for several iterations.
    depends_on:
      bob:
        condition: service_started

volumes:
  chat-data:
    name: chatmcp-e2e-chat-data
